# Deliver the Pi's S3 write key to the deploy Job via ESO, so a Garage key rotation converges
# onto the Pi automatically (PostSync hook / nightly belt) instead of requiring a manual push —
# the gap the 2026-08-24 Garage incident exposed: FU-051's deploy-only playbook deliberately
# skipped secrets ("s3.env placed at flash time"), and the flash-time writer was later deleted
# (snore-recorder b0715f2), leaving rotation with no automated path.
#
# Source of truth stays Infisical (the garage-workspace.yaml Workspace publishes the key there
# on every reconcile); the values are single-line, so the "\n" un-escape the SSH key needs does
# not apply. The template renders a ready-to-copy env file (one key: `s3.env`).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snore-s3-creds
  namespace: snore-recorder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: snore-s3-creds
    creationPolicy: Owner
    template:
      data:
        s3.env: |
          SNORE_S3_ACCESS_KEY_ID={{ .akid }}
          SNORE_S3_SECRET_KEY={{ .sk }}
  data:
    - secretKey: akid
      remoteRef: { key: SNORE_S3_ACCESS_KEY_ID }
    - secretKey: sk
      remoteRef: { key: SNORE_S3_SECRET_KEY }
