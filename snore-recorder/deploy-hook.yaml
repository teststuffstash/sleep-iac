# ArgoCD PostSync hook: runs the deploy playbook against the Pi as part of the sync operation, so a
# failed deploy turns the snore-recorder app RED (retry/rollback/alerting ride the existing ArgoCD
# stack — no new infra). hook-delete-policy BeforeHookCreation re-runs it cleanly each sync. The
# nightly CronJob (deploy-cron.yaml) is the belt for the offline-Pi gap (hooks only fire on sync).
#
# Image: stock alpine/ansible (ansible + openssh + rsync). The playbook/inventory/known_hosts are
# mounted from the `snore-deploy` ConfigMap; the SSH key from the ESO-rendered `snore-deploy-ssh`
# Secret — so nothing is baked and there is no image to build/push (no ghcr-push credential needed).
apiVersion: batch/v1
kind: Job
metadata:
  name: snore-deploy
  namespace: snore-recorder
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 2
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels: { app: snore-deploy }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: ansible
          image: alpine/ansible:2.18.1  # renovate: pin digest
          command: ["/bin/sh", "-ceu"]
          args:
            - |
              # Wait out the first-sync race while ESO renders the key Secret.
              for i in $(seq 30); do [ -s /secrets/id_ed25519 ] && break; echo "waiting for deploy key ($i)"; sleep 2; done
              printf '%s\n' "$(cat /secrets/id_ed25519)" > /tmp/id_ed25519 && chmod 0400 /tmp/id_ed25519
              ansible-galaxy collection install ansible.posix >/dev/null 2>&1 || true
              cd /config
              exec ansible-playbook -i inventory.ini deploy.yml --private-key /tmp/id_ed25519
          env:
            - { name: ANSIBLE_HOST_KEY_CHECKING, value: "True" }
            - { name: DEPLOY_KEY_PATH, value: /tmp/id_ed25519 }
            - { name: ANSIBLE_STDOUT_CALLBACK, value: default }
            - { name: HOME, value: /tmp }   # writable home for ansible's control path / galaxy
            # ssh args via env (not -e on the command line — shell/block-scalar quoting mangled the
            # -o flags). ControlMaster=no → no connection multiplexing / control path for a one-shot.
            - name: ANSIBLE_SSH_ARGS
              value: "-o ControlMaster=no -o UserKnownHostsFile=/config/known_hosts -o StrictHostKeyChecking=yes"
          volumeMounts:
            - { name: playbook, mountPath: /config, readOnly: true }
            - { name: ssh, mountPath: /secrets, readOnly: true }
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: "1", memory: 256Mi }
      volumes:
        - name: playbook
          configMap: { name: snore-deploy }
        - name: ssh
          secret: { secretName: snore-deploy-ssh, defaultMode: 0400 }
