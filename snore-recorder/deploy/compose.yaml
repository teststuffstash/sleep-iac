# snore-recorder deploy unit — Docker first (graduates to Podman + systemd quadlet later).
# Ansible drops this on the Pi (Raspberry Pi OS Lite) and runs `docker compose up -d`.
# Image is built off-cluster (arm64) and pulled from ghcr (ghcr.io/teststuffstash/snore-recorder).
services:
  snore-recorder:
    image: ${SNORE_IMAGE:-ghcr.io/teststuffstash/snore-recorder:latest}
    container_name: snore-recorder
    restart: unless-stopped
    # A redeploy sends SIGTERM: the daemon snapshots the in-progress night and exits,
    # then the fresh container resumes it (device graceful-redeploy). Give it ample time
    # to snapshot + upload before SIGKILL. (The deploy pulls the image BEFORE this stop,
    # so the recreate gap is just stop+start — see deploy.yml.)
    stop_grace_period: 30s
    # USB microphone (ALSA via PortAudio). The app picks the mic by name substring
    # (SNORE_INPUT_DEVICE); mounting all of /dev/snd avoids card-index churn on reboot.
    devices:
      - /dev/snd:/dev/snd
    # The Jabra Speak 410's HID node (call button + off-hook LED) is HOT-PLUGGED: it is
    # unplugged by day for work calls. A `devices:` entry is resolved once at container
    # create and makes create fail outright when the node is absent (2026-10-19: a daytime
    # deploy left the container in "Created", two nights lost). So the host's /dev is
    # bind-mounted live and the hidraw char-device major is allowed instead; the app opens
    # the udev symlink (99-snore-jabra-hidraw.rules, placed by deploy.yml — the ECM8000-U
    # mic has a HID interface too, so hidrawN order is luck) and reconnects on replug.
    # SNORE_HIDRAW_MAJOR is read from the Pi's /proc/devices by deploy.yml.
    device_cgroup_rules:
      - "c ${SNORE_HIDRAW_MAJOR:?SNORE_HIDRAW_MAJOR unset (deploy.yml writes it)}:* rw"
    # Garage S3 creds, provisioned from Infisical to a mode-600 host file. Ansible
    # ensures this file exists before `up` (compose errors on a missing env_file).
    env_file:
      - /var/lib/snore-secrets/s3.env
    # Button-armed recording: the Jabra call button arms a night (green LED on, recording
    # starts SNORE_ARM_DELAY_MIN later), a second press marks wake. The window below is the
    # BACKSTOP — recorded automatically if no button is pressed, so a forgotten press never
    # loses a night. (--controls null falls back to plain window recording.)
    command: ["run", "--controls", "jabra"]
    environment:
      SNORE_TZ: ${SNORE_TZ:-Europe/Tallinn}
      SNORE_WINDOW_START: ${SNORE_WINDOW_START:-00:00}
      SNORE_WINDOW_END: ${SNORE_WINDOW_END:-09:00}
      SNORE_ARM_DELAY_MIN: ${SNORE_ARM_DELAY_MIN:-20}
      # Mic name substring (ALSA card name); empty = default input device. The ECM8000-U
      # only does 44.1/48/96 kHz stereo, hence the rate/channels (downmixed to mono in-app).
      SNORE_INPUT_DEVICE: ${SNORE_INPUT_DEVICE:-ECM8000}
      SNORE_SAMPLE_RATE: ${SNORE_SAMPLE_RATE:-48000}
      SNORE_CHANNELS: ${SNORE_CHANNELS:-2}
      SNORE_DATA_DIR: /data
      SNORE_HIDRAW: /host-dev/jabra-hidraw
    # Store-and-forward spool: pending nights survive restarts / offline travel.
    volumes:
      - snore-data:/data
      - /dev:/host-dev:ro

volumes:
  snore-data:
