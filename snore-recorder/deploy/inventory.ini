# The Pi is pinned to 192.168.2.185 by a homelab DHCP reservation (b8:27:eb:fc:e8:7c).
# In-cluster pods can't resolve `snore-recorder.local` (mDNS), so target the fixed IP.
[snore]
snore-recorder ansible_host=192.168.2.185

[snore:vars]
ansible_user=rasmus
ansible_python_interpreter=/usr/bin/python3
