---
# Deploy-only playbook: update an ALREADY-PROVISIONED Pi (Docker + the mode-600
# /var/lib/snore-secrets/s3.env are placed once at flash time via the snore-recorder repo's
# provisioning; NOT re-fetched here, so this needs no Infisical — only the SSH key). Run in-cluster
# by the ArgoCD PostSync hook Job + the nightly CronJob belt. Idempotent; safe to re-run.
- name: Deploy snore-recorder
  hosts: snore
  gather_facts: false
  vars:
    snore_dir: /opt/snore-recorder
    deploy_key: "{{ lookup('ansible.builtin.env', 'DEPLOY_KEY_PATH') | default('/secrets/id_ed25519', true) }}"
  tasks:
    - name: App directory exists
      become: true
      ansible.builtin.file:
        path: "{{ snore_dir }}"
        state: directory
        mode: "0755"

    - name: Read the hidraw char-device major (dynamic per kernel; compose allows it for the Jabra)
      ansible.builtin.command: awk '$2 == "hidraw" { print $1 }' /proc/devices
      register: hidraw_major
      changed_when: false
      failed_when: hidraw_major.stdout is not regex('^[0-9]+$')

    - name: Sync compose.yaml
      become: true
      ansible.builtin.copy:
        src: compose.yaml
        dest: "{{ snore_dir }}/compose.yaml"
        mode: "0644"

    - name: Sync .env (SNORE_* config + image pin, plus the host's hidraw major)
      become: true
      ansible.builtin.copy:
        content: "{{ lookup('ansible.builtin.file', 'snore.env') }}\nSNORE_HIDRAW_MAJOR={{ hidraw_major.stdout }}\n"
        dest: "{{ snore_dir }}/.env"
        mode: "0644"

    - name: Stable device name for the Jabra's HID node (/dev/jabra-hidraw)
      # The app opens the symlink (via compose's live /dev bind); without it the button rides on
      # hidrawN enumeration order, which the ECM8000-U mic's own HID interface makes a coin flip.
      become: true
      ansible.builtin.copy:
        src: 99-snore-jabra-hidraw.rules
        dest: /etc/udev/rules.d/99-snore-jabra-hidraw.rules
        mode: "0644"
      register: udev_rule

    - name: Apply the udev rule to the already-plugged Jabra
      become: true
      ansible.builtin.shell: udevadm control --reload && udevadm trigger --subsystem-match=hidraw
      when: udev_rule.changed

    - name: Self-heal the deploy public key into authorized_keys
      # Derived from the mounted private key so future runs never depend on a manually-planted
      # key. (The FIRST run still needs today's access to bootstrap — see the PR notes.)
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('ansible.builtin.pipe', 'ssh-keygen -y -f ' + deploy_key) }}"

    - name: Pull the pinned image
      become: true
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ snore_dir }}"
      register: pull
      changed_when: "'Pull complete' in pull.stderr or 'Downloaded newer' in pull.stderr"

    - name: Reconcile the container (recreates on image / compose / .env change)
      become: true
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ snore_dir }}"
      register: up
      changed_when: "'Recreat' in up.stderr or 'Start' in up.stderr or 'Creat' in up.stderr"
