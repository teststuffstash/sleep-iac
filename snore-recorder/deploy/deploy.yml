---
# Deploy-only playbook: update an ALREADY-PROVISIONED Pi (Docker installed at flash time). Run
# in-cluster by the ArgoCD PostSync hook Job + the nightly CronJob belt. Idempotent; safe to re-run.
#
# The S3 write key (mode-600 /var/lib/snore-secrets/s3.env) IS synced here — from the ESO-rendered
# `snore-s3-creds` Secret the Job mounts at /secrets-s3 — so a Garage key rotation converges onto
# the Pi without a manual push (the 2026-08-24 incident gap). The task self-skips when no key file
# is mounted (a control-host run, or ESO hasn't rendered the Secret yet — its volume is optional),
# leaving the Pi's existing s3.env alone; the nightly belt converges it later.
- name: Deploy snore-recorder
  hosts: snore
  gather_facts: false
  vars:
    snore_dir: /opt/snore-recorder
    deploy_key: "{{ lookup('ansible.builtin.env', 'DEPLOY_KEY_PATH') | default('/secrets/id_ed25519', true) }}"
    # Controller-side path of the ESO-rendered key file; override for a control-host run.
    s3_env_src: "{{ lookup('ansible.builtin.env', 'S3_ENV_PATH') | default('/secrets-s3/s3.env', true) }}"
  tasks:
    - name: App directory exists
      become: true
      ansible.builtin.file:
        path: "{{ snore_dir }}"
        state: directory
        mode: "0755"

    # `is file` evaluates on the CONTROLLER (where the Secret is mounted) — skip, don't fail,
    # when absent, so the playbook still runs from a control host without the mount.
    - name: Secrets directory exists
      become: true
      ansible.builtin.file:
        path: /var/lib/snore-secrets
        state: directory
        owner: root
        group: root
        mode: "0700"
      when: s3_env_src is file

    - name: Sync the S3 write key (rotation converge — Infisical via ESO)
      become: true
      ansible.builtin.copy:
        src: "{{ s3_env_src }}"
        dest: /var/lib/snore-secrets/s3.env
        owner: root
        group: root
        mode: "0600"
      when: s3_env_src is file

    - name: Sync compose.yaml + .env (SNORE_* config + image pin)
      become: true
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ snore_dir }}/{{ item.dest }}"
        mode: "0644"
      loop:
        - { src: compose.yaml, dest: compose.yaml }
        - { src: snore.env, dest: .env }

    - name: Self-heal the deploy public key into authorized_keys
      # Derived from the mounted private key so future runs never depend on a manually-planted
      # key. (The FIRST run still needs today's access to bootstrap — see the PR notes.)
      ansible.posix.authorized_key:
        user: "{{ ansible_user }}"
        state: present
        key: "{{ lookup('ansible.builtin.pipe', 'ssh-keygen -y -f ' + deploy_key) }}"

    - name: Pull the pinned image
      become: true
      ansible.builtin.command:
        cmd: docker compose pull
        chdir: "{{ snore_dir }}"
      register: pull
      changed_when: "'Pull complete' in pull.stderr or 'Downloaded newer' in pull.stderr"

    - name: Reconcile the container (recreates on image / compose / .env change)
      become: true
      ansible.builtin.command:
        cmd: docker compose up -d --remove-orphans
        chdir: "{{ snore_dir }}"
      register: up
      changed_when: "'Recreat' in up.stderr or 'Start' in up.stderr or 'Creat' in up.stderr"
