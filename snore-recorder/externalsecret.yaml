# Deliver the Pi deploy SSH key to the in-cluster deploy Job via ESO (homelab ADR-062). The
# private key lives in Infisical homelab/prod as SNORE_DEPLOY_SSH_KEY; ESO renders it into the
# `snore-deploy-ssh` Secret the PostSync hook Job + CronJob mount. The un-escape template is
# required: the Infisical CLI stores multiline values with literal "\n" (v0.41.90) — same fix as
# homelab's arc-github-app ExternalSecret. Verified: the rendered key parses with `ssh-keygen -y`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: snore-deploy-ssh
  namespace: snore-recorder
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: snore-deploy-ssh
    creationPolicy: Owner
    template:
      data:
        id_ed25519: '{{ .key | replace "\\n" "\n" }}'
  data:
    - secretKey: key
      remoteRef: { key: SNORE_DEPLOY_SSH_KEY }
