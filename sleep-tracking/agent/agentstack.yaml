# The sleep stack's AgentStack claim (homelab FU-048/ADR-085) — the stack's agent POLICY in one CR;
# homelab's XRD+Composition render the fixer MECHANISM that git-token.yaml (this dir) and
# ../openrouter-key.yaml carried by hand. uv-cache.yaml + job-validate.yaml stay: they are not
# claim-rendered (shared wheel cache / historical bootstrap validation). Docs:
#   kubectl get cm -n crossplane-system agentstack-docs -o jsonpath='{.data.USAGE\.md}'
#   homelab docs/agents/agentstack.md
apiVersion: platform.teststuff.net/v1alpha1
kind: AgentStack
metadata:
  name: sleep
spec:
  mainRepo: homelab # sleep's coordination knowledge still lives in homelab docs
  coordinatorModel: sonnet
  # FU-080 graduation (2026-07-26): sleep runs its OWN per-stack coordinate loop in sleep-agents,
  # second stack after oracle. coordinator.enabled → the per-stack scan dispatches; loop.perStack →
  # the loop machinery is rendered (coordinate-sleep cron + loop-git legs + SA/RBAC); loop.graduated
  # → the GLOBAL scan SKIPS sleep so the two never double-run (the #134 label-race class) and the
  # doorbell edge routes to sleep-agents. graduated must land WITH coordinator.enabled — enabling the
  # coordinator without it would let the global scan dispatch sleep too. Reviewer graduated to
  # per-stack 2026-07-31 (reviewer.enabled below) as the operator phases out the GLOBAL reflexes.
  coordinator:
    # RE-ENABLED 2026-07-27 (the pausing session's flip-back): the platform build landed —
    # C6 merged-closeout + harvest, arbitrate, ci-red-stale, infra-enrich (-iac dispatch,
    # sleep-iac is a fixer now), SLO teeth, responder v2, deterministic revert. The queue it
    # rides: sleep-tracking#48 (system-test gate) → the spec bugs (#39-47; #42/#43 dep-held
    # on #48) → sleep-iac#22/#25.
    #
    # RE-ENABLED 2026-07-28 (meta-14, operator test of the FU-114/FU-115 machinery): the fixer
    # context is now three layers (env card + task/build recipe), and the red merge-path has an
    # edge + exhaustion (exporter red-doorbell → content-based ci-red clause → Red→arbitrate). The
    # #48 fix round now dispatches build.yaml on a docker-aware env card (incl. the #67 kind-mirror
    # lesson). Was PAUSED for the meta-14 machinery-gap investigation.
    enabled: true
  loop:
    perStack: true
    graduated: true
  reviewer:
    # ENABLED 2026-07-31 (operator, phasing out the GLOBAL review reflex): sleep now runs its OWN
    # per-stack review — the review-sleep cron + the FU-100 edge trigger route sleep PR reviews into
    # sleep-agents, and the global review workflow DEFERS graduated stacks (stacks.json guard), so
    # this is a clean handoff, not a double-review (reviewing is idempotent + budget-free anyway).
    # Matches oracle. Kept explicit (not omitted) so the API-server-defaulted bool doesn't drift the
    # ArgoCD app OutOfSync — same rule as the fixer egress/label defaults below.
    enabled: true
  # Chain update 2026-07-27 (operator graduation of scout #40 entrants — homelab
  # docs/agents/model-routing.md §M7 "evidence, not vibes": all three new entries carried clean
  # canary verdicts). Free entrants front the fallback walk for the xs/sm queue; `claude/haiku`
  # is the subscription-rail LAST backstop — strictly better than chain-exhaustion → agent/blocked
  # (requires claudeTier: true in EVERY fixer block below so the claude-session Secret renders).
  # FLIPPED to claude/haiku 2026-07-28 (operator, Phase 4). Brought forward from the "once #48 lands"
  # plan: deepseek-v4-flash proved too weak for #48 (3 rounds, gave up as "infra not a bug"; a
  # clean-but-useless exit is not a strike, so the chain couldn't self-heal to a stronger model).
  # The capable subscription model is now the primary so the re-dispatched #48 (+ the sleep queue)
  # runs on real capability; FU-088 latch/headroom gate throttles the subscription load. The free/
  # cheap OpenRouter entrants stay as the STRIKE/latch fallback walk (claude/haiku dropped from the
  # tail — it's the primary now). FU-095 task-class router still later.
  # ADR-096 addendum 4 live test (operator, 2026-08-02): FREE models led the chain as
  # deliberate instability canaries. Test yield after 3 clean rides (#92/#96/#99, PR#106-108):
  # free-first WORKS in good weather, but no cooldown episodes materialized (laguna 100% 2xx
  # all day) and its ~306s turns run ≈3× a paid ride's wall clock — one ride even outlived the
  # old 2h key window. Chain redirected same day (operator): cheap PAID leads — xiaomi/mimo-v2.5
  # (tooled fp8 endpoints ~$0.14/M in, ≥95 uptime) then tencent/hy3 (already graduated, mid-chain
  # since 07-27). Frees drop off the walk entirely: after a paid-lead strike they'd re-add
  # 401/429 noise exactly when recovery wants capability; passive provider_events keep scoring
  # them without burning rides. claude/haiku stays the cross-rail last resort.
  workerModel: xiaomi/mimo-v2.5
  workerModelFallbacks: [tencent/hy3, deepseek/deepseek-v4-flash, qwen/qwen3-coder, claude/haiku]
  repos:
    - name: sleep-iac # FIXER since 2026-07-27 (FU-106): the -iac wrapper is agent-workable — the
      # old "context-only, CI-only deploy repo" exclusion is DELIBERATELY re-opened here, via
      # this reviewed claim diff (never silently): infra issues (e.g. #22 spec-publishing lane)
      # dispatch the normal fixer flow; RED deploy/* bump PRs dispatch the distinct
      # infra-enrich class (homelab coordinator brief §infra-enrich). The fixer ns `sleep-iac`
      # is PLATFORM-precreated (homelab argocd/platform/sleep-namespaces.yaml — tenants cannot
      # create namespaces by project design; the first stack-side attempt was reverted).
      fixer:
        budgetUSD: 3
        resetInterval: weekly
        guardrail: none
        # true since the 2026-07-27 chain update: the stack chain ends in claude/haiku (and the
        # primary flips there post-#48) — a dispatch here needs the claude-session Secret in ns
        # sleep-iac, same trust domain as sleep-tracking's researcher rides.
        claudeTier: true
        docker: false
        egress:
          profile: none # explicit (server default) — baseline egress only; ArgoCD diff hygiene
          extraFQDNs: [] # explicit (server default) — ArgoCD diff hygiene
          enforce: false # MONITOR first, like every new fixer ns (FU-020 rollout rings)
      # Claim-owned label set (FU-068, sleep migration 2026-07-25): pre-migration diff — live set
      # was the platform taxonomy EXACTLY on all three repos, nothing custom to lose. Explicit
      # extra: [] (server default) — bare {} stamps to {extra: []}, ArgoCD drifts. tofu/github
      # still holds these labels in STATE — operator drops sleep repos from label_repos via
      # `tofu state rm` (NOT destroy).
      labels: { extra: [] }
    - name: snore-recorder # context-only: merge-path only; its ansible→Pi deploy is manual, no worker ns
      labels: { extra: [] }
    - name: sleep-tracking
      labels: { extra: [] }
      fixer:
        budgetUSD: 5 # USD/week standing ceiling (carried over)
        resetInterval: weekly
        guardrail: only-free
        # explicit (server defaults) — the API server stamps defaulted booleans into the stored
        # object, so omitting them leaves the ArgoCD app permanently OutOfSync (same rule as
        # extraFQDNs below; observed live 2026-07-16 when claudeTier's default landed).
        # Capability parity with oracle (2026-07-25, FU-095 prereq): the upcoming full-stack
        # k3d/Grafana evidence gate (ADR-082 shape) needs a real docker daemon — rides run as
        # kata microVM pods with a dind sidecar; the composition adds the registry FQDNs to the
        # egress allowlist. No gate consumes it yet; flipped ahead so the spec/evidence work
        # lands against ready plumbing.
        docker: true
        claudeTier: true # FU-105 researcher rides (claude harness) on this repo — renders the claude-session ref Secret
        egress:
          profile: python # uv sync: pypi.org + files.pythonhosted.org on top of the baseline
          extraFQDNs: [] # explicit (server default) — earned from a harvest, currently none; also keeps ArgoCD diff clean
          # MONITOR (FU-020 rollout ring 1): allowlist + DNS visibility attach, nothing blocked.
          # Harvest Hubble flows over ~3 real rides, then flip to true in a one-line PR here.
          # ENFORCED since 2026-07-16 (homelab FU-020 ring 2): canary ride harvested clean under
          # monitor — all destinations allowlisted or known-benign (models.dev + direct
          # openrouter.ai, both degrade gracefully; see homelab FU-020).
          enforce: true
