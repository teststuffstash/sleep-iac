# sleep-tracking — kustomize so the Grafana dashboard body can live as an editable, standalone JSON
# (configMapGenerator --from-file) instead of an inlined YAML string. The infra CRs are plain
# resources; the dashboard becomes a ConfigMap the Grafana sidecar auto-discovers by label. agent/
# is NOT listed here — the agent-fixer ApplicationSet (homelab) syncs it as its own Application.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - garage-workspace.yaml
  - gateway.yaml
  - httproute-specs.yaml
  - specs-workspace.yaml
  - externalsecret.yaml
  # openrouter-key.yaml removed 2026-07-12: the standing budget key is rendered by the sleep
  # AgentStack claim (agent/agentstack.yaml, homelab FU-048) — one-time key re-mint expected.

# Sleep Overview dashboard removed 2026-07-28 (issue #25, operator ruling 2026-07-27 resolving
# SLP-SRV-DRIFT): the dashboard now ships in the sleep-ingester CHART (sleep-tracking#48), rendered
# as the `sleep-ingester-dashboard` ConfigMap and discovered by the same `grafana_dashboard` sidecar
# label. Deleting the hand-carried generator (sleep-overview.json + this entry) leaves exactly ONE
# dashboard ConfigMap. Pinned chart carrying it: 2026.7.28-g55948c165977 (apps/sleep-ingester.yaml).
